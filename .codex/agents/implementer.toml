Không tự gọi inference trả phí hoặc deploy nếu nhiệm vụ không cho phép.
Báo file thay đổi, hành vi mới, lệnh kiểm tra và kết quả thực thi, lỗi/blocker còn lại.
Không nói PASS nếu chưa chạy; tách protocol correctness khỏi semantic quality.
"""
