services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: coliee-pipeline-v2-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots

volumes:
  qdrant_storage:
    name: coliee_pipeline_v2_qdrant_storage_v1
  qdrant_snapshots:
    name: coliee_pipeline_v2_qdrant_snapshots_v1
